name: Terraform Modular Engine

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      WORKING_DIR:
        required: true
        type: string
      Terraform_Backend_Configuration_File:
        required: true
        type: string
      Terraform_Deployment_Configuration_File:
        required: true
        type: string
      Action:
        required: true
        type: string # Expects: 'plan_only', 'apply', or 'destroy'

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  # ── JOB 1: PLAN ───────────────────────────────────────────────────────────
  plan:
    name: "Terraform Plan (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} 
    container:
      image: krishna0011/awscli-tf-1.5:latest
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/${{ inputs.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: |
          rm -rf .terraform
          terraform init -backend-config=${{ inputs.Terraform_Backend_Configuration_File }}

      - name: Terraform Validate
        run: terraform validate -no-color

      # Speculative Plan for PRs or Standard Merges
      - name: Terraform Plan (Standard)
        if: inputs.Action == 'apply' || inputs.Action == 'plan_only'
        run: |
          terraform plan \
            -var-file="${{ inputs.Terraform_Deployment_Configuration_File }}" \
            -out=tfplan \
            -no-color

      # Speculative Plan for explicit Destruction runs
      - name: Terraform Plan (Destroy)
        if: inputs.Action == 'destroy'
        run: |
          terraform plan -destroy \
            -var-file="${{ inputs.Terraform_Deployment_Configuration_File }}" \
            -out=tfplan \
            -no-color

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ github.workspace }}/${{ inputs.WORKING_DIR }}/tfplan
          retention-days: 1

  # ── JOB 2: EXECUTE (APPLY / DESTROY) ──────────────────────────────────────
  execute:
    name: "Terraform Execute (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    needs: plan
    # Gated to prevent code executions during basic Pull Requests
    if: inputs.Action == 'apply' || inputs.Action == 'destroy'
    environment: ${{ inputs.environment }} # <-- GitHub pauses execution here for manual approval gate
    container:
      image: krishna0011/awscli-tf-1.5:latest
      credentials:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PAT }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}/${{ inputs.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Init
        run: |
          rm -rf .terraform
          terraform init -backend-config=${{ inputs.Terraform_Backend_Configuration_File }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ github.workspace }}/${{ inputs.WORKING_DIR }}

      - name: Terraform Apply / Destroy Execution
        run: |
          terraform apply \
            -auto-approve \
            -no-color \
            tfplan
            